<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>03 図形キャラ「まる と しかく」</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/zen-maru-gothic/700.css">
<link rel="stylesheet" href="../../lib/base.css">
<script src="../../lib/mg.js"></script>
</head>
<body>
<script>
const { W, H, seg, ease, lerp, clamp, kf, rrect, noise1 } = MG;
const DURATION = 27;
const MARU = (s) => `700 ${s}px "Zen Maru Gothic"`;
const C = { sky1: '#ffd6a5', sky2: '#ffadad', sun: '#fff4d6', hill: '#f4a69a', ground: '#7c6f9c', groundTop: '#9b8ec4', maru: '#ff8a3d', shikaku: '#4d8ff0', sankaku: '#3ecf8e', ink: '#2b2240' };
const GROUND = 1300, EDGE = 150, R = 125, S = 230; // S = しかくの一辺

// ================= 演出タイミング =================
const T = {
  drop: 0.5, land: 1.3, flip1: [5.0, 5.5], flip2: [6.0, 6.9], sad: 7.4,
  windup: [9.5, 10.8], dash: [10.8, 12.6], notice: 11.7, impact: 12.6, bounce: [12.6, 13.4],
  realize: 13.8, thanks: [15.0, 16.2], hop: [16.4, 17.2], line: 18.3, title: 21.8, tri: 23.2, end: 25.2,
};

// ================= 効果音 =================
const sfx = [
  { t: 0, type: 'pad', dur: DURATION, chord: [261.6, 329.6, 392, 493.9], vol: 0.8 },
  { t: T.land, type: 'pop', pitch: 0.8 }, { t: T.land + 0.45, type: 'pop', pitch: 1.1, vol: 0.6 },
  { t: 2.2, type: 'roll', dur: 2.2, vol: 0.5 },
  { t: T.flip1[1], type: 'thump', pitch: 1.6 }, { t: T.flip2[1] - 0.1, type: 'thump', pitch: 1.4 },
  { t: 7.0, type: 'boing', pitch: 1.6, vol: 0.5 }, { t: 7.3, type: 'boing', pitch: 1.9, vol: 0.5 },
  { t: T.windup[0], type: 'roll', dur: 1.3, vol: 0.4 }, { t: T.dash[0], type: 'roll', dur: 1.8, vol: 1.0 },
  { t: T.dash[0], type: 'whoosh', dur: 1.8, vol: 0.8 },
  { t: T.notice, type: 'pop', pitch: 2.0 },
  { t: T.impact, type: 'hit' }, { t: T.impact + 0.05, type: 'boing', pitch: 0.8 },
  { t: T.realize, type: 'pop', pitch: 1.6, vol: 0.6 },
  { t: T.thanks[1] - 0.2, type: 'bell', freq: 1047 }, { t: T.hop[1], type: 'pop', pitch: 1.3 },
  { t: T.line, type: 'bell', freq: 784, vol: 0.7 },
  { t: T.tri + 0.3, type: 'thump', pitch: 2.2, vol: 0.6 }, { t: T.tri + 0.8, type: 'thump', pitch: 2.4, vol: 0.6 },
  { t: T.end, type: 'bell', freq: 659 },
];

// ================= まるの動き =================
const SH_X1 = 620, SH_X2 = SH_X1 - S; // しかくの位置（1回転がった後）
function maru(t) {
  const hitX = SH_X2 + S / 2 + R; // しかくに当たる位置
  const x = kf(t, [[0, 880], [T.land + 0.8, 880], [2.8, 940, 'inOut'], [4.2, 860], [T.windup[0], 860, 'inOut'], [T.windup[1], 940, 'outCubic'], [T.dash[0], 940, 'inQuad'], [T.impact, hitX, 'outQuad'], [T.bounce[1], 760], [T.thanks[0], 760, 'inOut'], [T.thanks[0] + 0.6, hitX, 'outBack'], [T.hop[0], hitX, 'inOut'], [T.hop[1], SH_X2]]);
  let y = GROUND - R;
  if (t < T.land) y = lerp(-200, GROUND - R, ease.inQuad(seg(t, T.drop, T.land)));
  y -= Math.abs(Math.sin(seg(t, T.land, T.land + 0.9) * Math.PI * 2)) * 120 * (1 - seg(t, T.land, T.land + 0.9));
  // 笑って跳ねる
  if (t > 6.9 && t < 7.8) y -= Math.abs(Math.sin((t - 6.9) * 14)) * 40;
  // しかくの上にジャンプ
  if (t > T.hop[0]) { const p = seg(t, T.hop[0], T.hop[1]); y = lerp(GROUND - R, GROUND - S - R, ease.outCubic(p)) - Math.sin(p * Math.PI) * 180; }
  // 衝突でつぶれる
  const hp = seg(t, T.impact, T.impact + 0.5);
  const sq = t > T.impact ? 1 - 0.35 * Math.sin(hp * Math.PI) * (1 - hp) * 1.6 : 1;
  let mood = 'happy';
  if (t > 4.2) mood = 'normal';
  if (t > T.windup[0]) mood = 'happy';
  if (t > T.notice) mood = 'panic';
  if (t > T.impact) mood = 'dizzy';
  if (t > T.realize) mood = 'panic';
  if (t > T.thanks[0]) mood = 'happy';
  const look = t > T.realize && t < T.thanks[0] ? (t < T.realize + 0.7 ? -1 : 0) : t > T.hop[1] ? -0.8 : x > 800 ? -0.5 : 0;
  return { x, y, sq, mood, look, rot: -x / R };
}

// ================= しかくの動き =================
function shikaku(t) {
  let cx = SH_X1, ang = 0, pivot = null;
  if (t >= T.flip1[0]) {
    const p = ease.inOut(seg(t, T.flip1[0], T.flip1[1]));
    if (t < T.flip1[1]) { pivot = SH_X1 - S / 2; ang = -p * Math.PI / 2; } else cx = SH_X2;
  }
  // 2回目は途中で失敗して戻る
  if (t >= T.flip2[0] && t < T.flip2[1]) {
    const p = seg(t, T.flip2[0], T.flip2[1]);
    pivot = SH_X2 - S / 2; ang = -Math.sin(Math.min(1, p * 1.3) * Math.PI) * 0.8 - Math.sin(p * 30) * 0.05 * (1 - p);
  }
  let mood = 'normal';
  if (t > 4.5) mood = 'determined';
  if (t > T.sad) mood = 'sad';
  if (t > T.notice + 0.2) mood = 'panic';
  if (t > T.notice + 0.6) mood = 'determined';
  if (t > T.impact + 0.6) mood = 'normal';
  if (t > T.thanks[1] - 0.3) mood = 'happy';
  const look = t < 4.5 ? clamp((maru(t).x - cx) / 400, -1, 1) : t > T.sad && t < T.notice ? -0.6 : t > T.hop[1] ? -0.8 : 0.8;
  // 衝突の瞬間: 踏ん張って少しつぶれる
  const brace = t > T.notice + 0.6 && t < T.impact + 0.6 ? 0.93 : 1;
  const shake = t > T.impact && t < T.impact + 0.4 ? Math.sin(t * 90) * 6 * (1 - seg(t, T.impact, T.impact + 0.4)) : 0;
  return { cx: cx + shake, ang, pivot, mood, look, brace };
}

// ================= 顔 =================
function face(ctx, mood, look, t, bodyColor, seed) {
  const blink = (t * 1.0 + seed) % 3.7 < 0.12;
  const lx = look * 16;
  for (const side of [-1, 1]) {
    const ex = side * 30 + lx, ey = -10;
    ctx.save(); ctx.translate(ex, ey);
    ctx.fillStyle = ctx.strokeStyle = C.ink; ctx.lineWidth = 8; ctx.lineCap = 'round';
    if (mood === 'happy') {
      ctx.beginPath(); ctx.arc(0, 6, 14, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (mood === 'dizzy') {
      ctx.beginPath(); for (let a = 0; a < 12; a += 0.3) { const r = a * 1.4; ctx.lineTo(Math.cos(a + t * 12) * r, Math.sin(a + t * 12) * r); } ctx.lineWidth = 4; ctx.stroke();
    } else {
      const big = mood === 'panic' ? 1.35 : 1;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 17 * big, (blink ? 2 : 22) * big, 0, 0, Math.PI * 2); ctx.fill();
      if (!blink) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(lx * 0.4, 4, mood === 'panic' ? 6 : 10, 0, Math.PI * 2); ctx.fill(); }
      if (mood === 'sad') { ctx.fillStyle = bodyColor; ctx.beginPath(); ctx.moveTo(-26, -30); ctx.lineTo(26, -30); ctx.lineTo(26 * side, 2); ctx.closePath(); ctx.fill(); }
      if (mood === 'determined') { ctx.strokeStyle = C.ink; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-20 * side, -36); ctx.lineTo(18 * side, -24); ctx.stroke(); }
    }
    ctx.restore();
  }
  // ほっぺ
  if (mood === 'happy') { ctx.fillStyle = 'rgba(255,90,120,0.45)'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 52 + lx, 22, 14, 9, 0, 0, Math.PI * 2); ctx.fill(); } }
}

function drawMaru(ctx, t) {
  const m = maru(t);
  ctx.save(); ctx.translate(m.x, m.y - R * (1 - m.sq));
  ctx.scale(m.sq, 2 - m.sq);
  ctx.fillStyle = C.maru; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  // 回転がわかる模様
  ctx.save(); ctx.rotate(m.rot); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, R - 20, 0.2, 0.9); ctx.stroke(); ctx.restore();
  ctx.scale(R / 90, R / 90); face(ctx, m.mood, m.look, t, C.maru, 0.4);
  ctx.restore();
  // 目が回っている星
  if (m.mood === 'dizzy') for (let i = 0; i < 3; i++) {
    const a = t * 6 + i * 2.1; star(ctx, m.x + Math.cos(a) * 90, m.y - R - 20 + Math.sin(a) * 20, 18);
  }
  // スピード線
  if (t > T.dash[0] + 0.3 && t < T.impact) {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) { const yy = m.y - 60 + i * 40, len = 80 + (i % 2) * 60; ctx.beginPath(); ctx.moveTo(m.x + R + 20, yy); ctx.lineTo(m.x + R + 20 + len, yy); ctx.stroke(); }
  }
  // ブレーキの火花
  if (t > T.notice && t < T.impact) {
    const r = MG.rng(Math.floor(t * 30));
    ctx.fillStyle = '#ffe066';
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(m.x + 40 + r() * 80, GROUND - r() * 40, 4 + r() * 6, 0, Math.PI * 2); ctx.fill(); }
  }
}

function drawShikaku(ctx, t) {
  const s = shikaku(t);
  ctx.save();
  if (s.pivot !== null) { ctx.translate(s.pivot, GROUND); ctx.rotate(s.ang); ctx.translate(S / 2, -S / 2); }
  else { ctx.translate(s.cx, GROUND - S / 2 * s.brace); ctx.scale(2 - s.brace, s.brace); }
  ctx.fillStyle = C.shikaku; rrect(ctx, -S / 2, -S / 2, S, S, 18); ctx.fill();
  ctx.translate(0, -8); ctx.scale(S / 170, S / 170);
  face(ctx, s.mood, s.look, t, C.shikaku, 1.9);
  ctx.restore();
  const cx = s.pivot !== null ? s.pivot + S / 2 : s.cx;
  // 汗・びっくりマーク・ハート
  if (t > T.sad && t < T.notice) { const p = (t - T.sad) % 1.4 / 1.4; ctx.fillStyle = '#a8d8ff'; ctx.beginPath(); ctx.ellipse(cx + 70, GROUND - S - 10 + p * 40, 10, 16, 0, 0, Math.PI * 2); ctx.globalAlpha = 1 - p; ctx.fill(); ctx.globalAlpha = 1; }
  if (t > T.notice && t < T.impact) { const k = ease.outBack(seg(t, T.notice, T.notice + 0.25)); ctx.fillStyle = C.ink; ctx.font = MARU(110 * k); ctx.textAlign = 'center'; ctx.fillText('!', cx + 20, GROUND - S - 40); ctx.textAlign = 'left'; }
  if (t > T.thanks[1] - 0.3 && t < T.line + 2) heart(ctx, (cx + maru(t).x) / 2, GROUND - S - 140 - seg(t, T.thanks[1] - 0.3, T.line + 2) * 120, 50 * ease.outBack(seg(t, T.thanks[1] - 0.3, T.thanks[1])), 1 - seg(t, T.line + 1.2, T.line + 2));
}

function star(ctx, x, y, r) {
  ctx.fillStyle = '#ffe066'; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.fill();
}
function heart(ctx, x, y, s, a) {
  if (s <= 0 || a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s / 50, s / 50); ctx.fillStyle = '#ff5c8a';
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.bezierCurveTo(-60, -10, -30, -60, 0, -28); ctx.bezierCurveTo(30, -60, 60, -10, 0, 30); ctx.fill();
  ctx.restore();
}

// ================= 三角（次回予告） =================
function drawSankaku(ctx, t) {
  if (t < T.tri) return;
  // ぎこちなく転がってくる
  const p = seg(t, T.tri, T.tri + 1.6), steps = 2, k = p * steps, i = Math.floor(Math.min(k, steps - 0.001)), f = ease.inOut(k - i);
  const side = 200, h = side * Math.sqrt(3) / 2, x0 = W + 120 - i * side;
  ctx.save(); ctx.translate(x0 - (p >= 1 ? side : 0), GROUND);
  if (p < 1) ctx.rotate(-f * Math.PI * 2 / 3);
  ctx.translate(-side / 2, 0);
  ctx.fillStyle = C.sankaku; ctx.beginPath(); ctx.moveTo(-side / 2, 0); ctx.lineTo(side / 2, 0); ctx.lineTo(0, -h); ctx.closePath(); ctx.fill();
  if (p >= 1) { ctx.save(); ctx.translate(0, -h * 0.35); ctx.scale(0.7, 0.7); face(ctx, 'normal', -0.6, t, C.sankaku, 3); ctx.restore(); }
  ctx.restore();
  if (p >= 1) { const q = ease.outBack(seg(t, T.tri + 1.7, T.tri + 2.0)); ctx.fillStyle = C.ink; ctx.font = MARU(90 * q); ctx.fillText('?', x0 - side + 40, GROUND - h - 30); }
}

// ================= 背景・文字 =================
function drawWorld(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  const dusk = seg(t, 14, 22);
  g.addColorStop(0, dusk > 0 ? mix('#ffd6a5', '#c8a2ff', dusk) : C.sky1); g.addColorStop(1, C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 夕日（崖の向こう）
  const sy = lerp(820, 1000, dusk);
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(-40, sy, 200, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,214,0.25)'; ctx.beginPath(); ctx.arc(-40, sy, 280, 0, Math.PI * 2); ctx.fill();
  // 遠くの丘
  ctx.fillStyle = C.hill; ctx.beginPath(); ctx.moveTo(0, GROUND + 200);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 1120 + Math.sin(x / 170) * 40 + Math.sin(x / 70) * 12);
  ctx.lineTo(W, GROUND + 200); ctx.fill();
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (const [x0, y0, s] of [[200, 420, 1], [760, 300, 1.3], [1100, 560, 0.8]]) {
    const x = ((x0 + t * 12 * s) % (W + 400)) - 200;
    for (const [dx, dy, r] of [[0, 0, 50], [50, -20, 60], [110, 0, 48]]) { ctx.beginPath(); ctx.arc(x + dx * s, y0 + dy * s, r * s, 0, Math.PI * 2); ctx.fill(); }
  }
  // 地面と崖
  ctx.fillStyle = C.ground; ctx.fillRect(EDGE, GROUND, W - EDGE, H - GROUND);
  ctx.fillStyle = C.groundTop; ctx.fillRect(EDGE, GROUND, W - EDGE, 26);
  ctx.fillStyle = '#5d527a'; ctx.beginPath(); ctx.moveTo(EDGE, GROUND); ctx.lineTo(EDGE - 30, H); ctx.lineTo(EDGE, H); ctx.fill();
}
function mix(a, b, p) {
  const pa = [1, 3, 5].map((i) => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.substr(i, 2), 16));
  return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], p))).join(',')})`;
}

function text(ctx, s, y, size, a, color = C.ink) {
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.font = MARU(size); ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(s, W / 2, y);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

function draw(ctx, t) {
  ctx.save();
  // 衝突の画面ゆれ + ラストに向けて少し寄る
  const sh = t > T.impact && t < T.impact + 0.35 ? (1 - seg(t, T.impact, T.impact + 0.35)) * 24 : 0;
  const z = 1 + 0.12 * ease.inOut(seg(t, T.hop[1], T.title));
  ctx.translate(noise1(t * 30, 1) * sh, noise1(t * 30, 2) * sh);
  ctx.translate(SH_X2, GROUND); ctx.scale(z, z); ctx.translate(-SH_X2, -GROUND);
  drawWorld(ctx, t);
  drawShikaku(ctx, t);
  drawMaru(ctx, t);
  drawSankaku(ctx, t);
  ctx.restore();
  // タイトル（冒頭）とモノローグ（ラスト）
  const ta = Math.min(seg(t, 0, 0.3), 1 - seg(t, 2.6, 3.2));
  text(ctx, 'まる と しかく', 420, 110, ta);
  text(ctx, 'ころがれない しかくの はなし', 520, 44, ta, '#6b5a8e');
  const la = seg(t, T.line, T.line + 0.8) * (1 - seg(t, T.title - 0.4, T.title));
  text(ctx, 'ころがれないから、', 420, 74, la);
  text(ctx, 'とめられた。', 520, 74, seg(t, T.line + 0.9, T.line + 1.7) * (1 - seg(t, T.title - 0.4, T.title)));
  text(ctx, 'まる と しかく', 420, 96, seg(t, T.title, T.title + 0.6));
  text(ctx, 'だい1わ', 510, 44, seg(t, T.title, T.title + 0.6), '#6b5a8e');
  text(ctx, 'つづく', 1620, 64, seg(t, T.end, T.end + 0.6), '#fff');
}

const allText = 'まるとしかくころがれないしかくのはなしころがれないから、とめられた。だい1わつづく!?';
MG.create({ duration: DURATION, draw, sfx, fonts: [{ family: 'Zen Maru Gothic', weight: 700, text: allText }] });
</script>
</body>
</html>

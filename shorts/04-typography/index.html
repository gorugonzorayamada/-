<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>04 文字が演技するドラマ「またね、の続き」</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/shippori-mincho/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/shippori-mincho/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/noto-sans-jp/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="../../lib/base.css">
<script src="../../lib/mg.js"></script>
</head>
<body>
<script>
const { W, H, seg, ease, lerp, clamp, rrect, noise1, rng } = MG;
const DURATION = 31;
const MIN = (w, s) => `${w} ${s}px "Shippori Mincho"`;
const SANS = (w, s) => `${w} ${s}px "Noto Sans JP"`;
const C = { bg: '#0f1424', ink: '#eef0f7', dim: '#7d8499', warm: '#ffb86b' };

// ================= 脚本 =================
// 各行: 表示区間 [in, out]、y、文字サイズ、演出 fx、色
//   fx: rise=下から浮かぶ / pop=弾んで出る / shrink=だんだん小さく / tremble=震えが強まる / fall=最後に崩れ落ちる
const LINES = [
  { in: 0.3, out: 2.9, y: 860, size: 72, text: 'ずっと、' },
  { in: 0.9, out: 2.9, y: 980, size: 72, text: '言えなかったことがある。' },
  { in: 3.2, out: 5.7, y: 920, size: 72, text: 'あの日、駅のホームで。', rule: true },
  { in: 5.9, out: 8.3, y: 800, size: 72, text: '君は' },
  { in: 6.4, out: 8.3, y: 980, size: 140, text: '「またね」', fx: 'pop', color: C.warm },
  { in: 7.2, out: 8.3, y: 1120, size: 72, text: 'と笑った。' },
  { in: 8.5, out: 11.2, y: 800, size: 110, text: '僕は', fx: 'pop' },
  { in: 9.1, out: 11.2, y: 960, size: 80, text: '「うん」', fx: 'shrink', color: C.dim },
  { in: 9.9, out: 11.2, y: 1100, size: 64, text: 'としか言えなかった。' },
  { in: 11.4, out: 14.6, y: 940, size: 170, text: '本当は', fx: 'tremble', weight: 800 },
  { in: 14.8, out: 18.3, y: 960, size: 180, text: '行かないで', fx: 'fall', weight: 800, stagger: 0.18, fallAt: 16.9 },
  { in: 18.5, out: 20.7, y: 940, size: 60, text: '——って、言いたかった。', color: C.dim },
  { in: 20.9, out: 23.3, y: 800, size: 72, text: 'あれから' },
  { in: 23.5, out: 25.8, y: 880, size: 76, text: '今なら、' },
  { in: 24.1, out: 25.8, y: 1000, size: 76, text: '言える気がする。' },
];
const T_YEARS = [21.3, 23.3];         // 「3年」のカウントアップ
const T_NOTIFY = 26.0, T_REACT = 27.4, T_END = 28.8;

// ================= 効果音 =================
const sfx = [{ t: 0, type: 'pad', dur: DURATION, chord: [174.6, 220, 261.6, 329.6], vol: 1 }];
for (const l of LINES) {
  const n = [...l.text].length, st = l.stagger ?? 0.06;
  if (l.fx === 'pop' || l.fx === 'fall') for (let i = 0; i < n; i++) sfx.push({ t: l.in + i * st, type: l.fx === 'fall' ? 'thump' : 'pop', pitch: 1 + i * 0.1, vol: 0.6 });
  if (l.fx === 'fall') for (let i = 0; i < n; i++) sfx.push({ t: l.fallAt + i * 0.12 + 0.55, type: 'hit', vol: 0.35 });
}
for (let i = 0; i < 3; i++) sfx.push({ t: T_YEARS[0] + 0.3 + i * 0.45, type: 'tick', vol: 0.9 });
sfx.push({ t: 11.4, type: 'drone', dur: 5.6, vol: 1.1 });
sfx.push({ t: T_NOTIFY + 0.1, type: 'ping', vol: 1.1 }, { t: T_END, type: 'bell', freq: 523 }, { t: T_END + 0.5, type: 'bell', freq: 659 });

// ================= 文字アニメーション =================
function drawLine(ctx, l, t) {
  if (t < l.in || t > l.out + 0.6) return;
  const chars = [...l.text], st = l.stagger ?? 0.06;
  ctx.font = (l.weight === 800 ? MIN(800, l.size) : MIN(500, l.size));
  const widths = chars.map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  const out = 1 - seg(t, l.out, l.out + 0.5);
  chars.forEach((ch, i) => {
    const p = seg(t, l.in + i * st, l.in + i * st + 0.5);
    if (p <= 0) { x += widths[i]; return; }
    let dx = 0, dy = 0, rot = 0, sc = 1, a = ease.outCubic(p) * out;
    switch (l.fx) {
      case 'pop': sc = ease.outBack(p); break;
      case 'shrink': sc = lerp(1, 0.45, ease.inOut(seg(t, l.in + 0.6, l.out))); break;
      case 'tremble': { const k = 2 + seg(t, l.in, l.out) * 16; dx = noise1(t * 25, i) * k; dy = noise1(t * 25, i + 9) * k; dy -= (1 - ease.outCubic(p)) * 40; break; }
      case 'fall': {
        sc = ease.outBack(p);
        const hold = seg(t, l.in + 1.0, l.fallAt); // 必死に踏ん張る震え
        dx = noise1(t * 30, i) * hold * 10; dy = noise1(t * 30, i + 5) * hold * 10;
        const f = Math.max(0, t - (l.fallAt + i * 0.12));
        dy += 0.5 * 5200 * f * f; rot = f * (i % 2 ? 2.2 : -1.8); dx += f * (i - 2) * 90;
        break;
      }
      default: dy = (1 - ease.outCubic(p)) * 40;
    }
    ctx.save();
    ctx.globalAlpha = clamp(a);
    ctx.translate(x + widths[i] / 2 + dx, l.y + dy); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.fillStyle = l.color || C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    x += widths[i];
  });
  // ホームの白線
  if (l.rule) {
    const p = ease.inOut(seg(t, l.in + 0.4, l.in + 1.6));
    ctx.globalAlpha = out * 0.6; ctx.fillStyle = C.ink; ctx.fillRect(W / 2 - 400 * p, l.y + 80, 800 * p, 3); ctx.globalAlpha = 1;
  }
}

// 「3年」: 数字がスロットのように回る
function drawYears(ctx, t) {
  const [a, b] = T_YEARS;
  if (t < a || t > b + 0.6) return;
  const out = 1 - seg(t, b, b + 0.5), n = clamp((t - a - 0.3) / 0.45, 0, 2) + 1; // 1 → 3
  ctx.save(); ctx.globalAlpha = seg(t, a, a + 0.3) * out;
  ctx.font = MIN(800, 260); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.rect(0, 890, W, 260); ctx.clip();
  const base = Math.floor(n), f = ease.outBack(n - base);
  for (let k = -1; k <= 1; k++) { const v = base + k; if (v >= 1 && v <= 3) ctx.fillText(String(v), W / 2 - 80, 1020 + (k - f) * 260 * (v === 3 && base === 3 ? 0 : 1)); }
  ctx.restore();
  ctx.globalAlpha = seg(t, a + 1.3, a + 1.7) * out; ctx.font = MIN(500, 110); ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('年', W / 2 + 20, 1030); ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
}

// 通知バナーと結末
function drawNotify(ctx, t) {
  const p = ease.outBack(seg(t, T_NOTIFY, T_NOTIFY + 0.6));
  if (p <= 0) return;
  const y = lerp(-260, 160, p);
  ctx.fillStyle = 'rgba(40,46,66,0.96)'; rrect(ctx, 50, y, W - 100, 210, 44); ctx.fill();
  ctx.fillStyle = C.warm; rrect(ctx, 90, y + 44, 84, 84, 22); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = SANS(700, 40); ctx.textAlign = 'center'; ctx.fillText('あ', 132, y + 100); ctx.textAlign = 'left';
  ctx.fillStyle = C.ink; ctx.font = SANS(700, 40); ctx.fillText('あかり', 206, y + 82);
  ctx.fillStyle = C.dim; ctx.font = SANS(400, 30); ctx.textAlign = 'right'; ctx.fillText('今', W - 90, y + 82); ctx.textAlign = 'left';
  ctx.fillStyle = C.ink; ctx.font = SANS(400, 42); ctx.fillText('「またね」の続き、聞かせて？', 206, y + 150);
  // 「またね」の文字だけ光る → 冒頭の「またね」とつながる
  const react = seg(t, T_REACT, T_REACT + 0.6);
  if (react > 0) {
    ctx.globalAlpha = react; ctx.font = MIN(800, 120); ctx.textAlign = 'center'; ctx.fillStyle = C.warm;
    ctx.fillText('……え？', W / 2 + noise1(t * 20, 3) * 4, 960);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

function drawEnd(ctx, t) {
  const a = seg(t, T_END, T_END + 0.8);
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = C.dim; ctx.font = MIN(500, 40); ctx.fillText('第1話', W / 2, 1300);
  ctx.fillStyle = C.ink; ctx.font = MIN(800, 72); ctx.fillText('「またね」の続き', W / 2, 1400);
  ctx.globalAlpha = seg(t, T_END + 1.0, T_END + 1.6); ctx.fillStyle = C.warm; ctx.font = MIN(500, 52); ctx.fillText('つづく', W / 2, 1540);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

// 背景: 漂う光の粒 + ビネット。感情に合わせて色温度が変わる
const dust = (() => { const r = rng(7), a = []; for (let i = 0; i < 60; i++) a.push([r() * W, r() * H, 2 + r() * 6, r() + 0.2]); return a; })();
function drawBg(ctx, t) {
  const tense = seg(t, 11.4, 14.8) * (1 - seg(t, 18, 19));
  const hope = seg(t, 23.5, 27);
  const r = 15 + tense * 25 + hope * 20, g = 20 + hope * 8, b = 36 - tense * 14 - hope * 6;
  ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`; ctx.fillRect(0, 0, W, H);
  for (const [x, y, s, sp] of dust) {
    const yy = (y - t * 30 * sp + H) % H, xx = x + Math.sin(t * sp + y) * 20;
    ctx.fillStyle = hope > 0.3 ? `rgba(255,200,140,${0.25 + 0.2 * hope})` : 'rgba(200,210,255,0.25)';
    ctx.beginPath(); ctx.arc(xx, yy, s, 0, Math.PI * 2); ctx.fill();
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function draw(ctx, t) {
  drawBg(ctx, t);
  // 「行かないで」が崩れる瞬間だけ画面が揺れる
  const sh = t > 17.4 && t < 18.2 ? (1 - seg(t, 17.4, 18.2)) * 14 : 0;
  ctx.save(); ctx.translate(noise1(t * 30, 1) * sh, noise1(t * 30, 2) * sh);
  for (const l of LINES) drawLine(ctx, l, t);
  drawYears(ctx, t);
  ctx.restore();
  drawNotify(ctx, t);
  drawEnd(ctx, t);
}

const allText = LINES.map((l) => l.text).join('') + '123年……え？第1話「またね」の続きつづく';
const uiText = 'あかり今「またね」の続き、聞かせて？';
MG.create({
  duration: DURATION, draw, sfx,
  fonts: [
    { family: 'Shippori Mincho', weight: 500, text: allText }, { family: 'Shippori Mincho', weight: 800, text: allText },
    { family: 'Noto Sans JP', weight: 400, text: uiText }, { family: 'Noto Sans JP', weight: 700, text: uiText },
  ],
});
</script>
</body>
</html>
